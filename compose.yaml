services:
  postgres:
    image: postgres:16
    container_name: pennywise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pennywise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pennywise-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pennywise"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pennywise-data:
