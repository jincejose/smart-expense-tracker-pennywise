<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${formTitle})}"></head><body><div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${page})}"></aside><main class="main-area"><header th:replace="~{fragments/topbar :: topbar}"></header><div class="page-wrap form-page">
  <a class="back-link" th:href="@{/transactions}">← Back to transactions</a><div class="form-card panel"><div class="form-card-heading"><div class="eyebrow"><i class="live-dot"></i> QUICK &amp; EASY</div><h1 th:text="${formTitle}">Add an expense</h1><p>A little detail helps you see the full picture.</p></div><form method="post" th:action="${formAction}" th:object="${form}" class="expense-form">
    <label class="field-label">What was it for?<input type="text" th:field="*{title}" maxlength="100" placeholder="e.g. Coffee with a friend" required autofocus><small class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Please enter a description.</small></label>
    <div class="form-grid"><label class="field-label">Amount (₹ INR)<input type="number" th:field="*{amount}" min="0.01" step="0.01" placeholder="0.00" required><small class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Enter an amount above zero.</small></label><label class="field-label">Category<select th:field="*{category}" required><option value="">Choose a category</option><option th:each="category : ${categories}" th:value="${category}" th:text="${category}">Food &amp; dining</option></select><small class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Choose a category.</small></label></div>
    <div class="form-grid"><label class="field-label">Date<input type="date" th:field="*{spentOn}" required><small class="field-error" th:if="${#fields.hasErrors('spentOn')}" th:errors="*{spentOn}">Choose a date.</small></label><label class="field-label">Payment method<select th:field="*{paymentMethod}"><option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${method}">Card</option></select></label></div>
    <label class="field-label">A note (optional)<input type="text" th:field="*{note}" maxlength="200" placeholder="Add a little context…"></label>
    <div class="form-actions"><a class="outline-button" th:href="@{/transactions}">Cancel</a><button class="primary-button" type="submit" th:text="${formTitle == 'Edit expense' ? 'Save changes' : 'Add expense'}">Add expense</button></div>
  </form></div></div></main></div><script th:src="@{/js/app.js}"></script></body></html>
