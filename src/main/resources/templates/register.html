<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create account')}"></head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" th:href="@{/login}" aria-label="PennYwise"><span class="brand-mark">PYw</span><span class="brand-name">Penn<span>Y</span>wise<small>PERSONAL FINANCE</small></span></a>
    <div class="login-intro"><span class="login-eyebrow">A FRESH START FOR YOUR FINANCES</span><h1>Create your account</h1><p>Choose a username and password to get started.</p></div>
    <div class="login-message login-error" th:if="${accountExists}">That username is already taken. Try another one.</div>
    <form class="login-form" th:action="@{/register}" th:object="${registrationForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Username<input th:field="*{username}" autocomplete="username" minlength="3" maxlength="30" required autofocus></label>
      <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
      <label>Password<input th:field="*{password}" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
      <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
      <button class="primary-button login-submit" type="submit">Create account <span>→</span></button>
    </form>
    <p class="login-create-account">Already have an account? <a th:href="@{/login}">Sign in</a></p>
    <p class="login-currency">All amounts are tracked in Indian rupees <strong>₹ INR</strong>.</p>
  </main>
</body>
</html>
